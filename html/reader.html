<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReadHub - Reader</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1f2923;
        }

        .reader-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .reader-nav {
            height: 58px;
            flex-shrink: 0;
            padding: 0 24px;
            background: #2c3e35;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .reader-nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .reader-nav a:hover {
            text-decoration: underline;
        }

        .reader-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
        }

        .reader-content {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 25px;
            background: #dfe3df;
        }

        #pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            display: block;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
        }

        .reader-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 10px 16px;

            background: #2c3e35;
            border-radius: 999px;

            color: white;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.25);

            z-index: 100;
        }

        .reader-controls button {
            border: none;
            background: #627563;
            color: white;

            padding: 8px 14px;
            border-radius: 7px;

            cursor: pointer;
            font-size: 14px;
        }

        .reader-controls button:hover {
            background: #718574;
        }

        .page-info {
            min-width: 90px;
            text-align: center;
            font-size: 14px;
        }

        .loading {
            color: #2c3e35;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div class="reader-container">

    <div class="reader-nav">

        <a href="{{ url_for('library') }}">
            ← Back to Library
        </a>

        <div class="reader-title">
            {{ filename | default('ReadHub Reader') }}
        </div>

    </div>


    <div class="reader-content" id="readerContent">

        <div id="pdf-container">

            <div class="loading">
                Loading book...
            </div>

        </div>

    </div>


    <div class="reader-controls">

        <button id="prevPage">
            ←
        </button>

        <div class="page-info">
            Page <span id="pageNumber">1</span>
            /
            <span id="pageCount">0</span>
        </div>

        <button id="nextPage">
            →
        </button>

        <button id="fullscreenBtn">
            ⛶
        </button>

    </div>

</div>


<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

    /*
     * ============================
     * BOOK INFORMATION
     * ============================
     */

    const params =
        new URLSearchParams(window.location.search);

    const pdfFile =
        params.get("file");

    const bookTitle =
        params.get("title") || "unknown";


    /*
     * ============================
     * PDF.JS SETUP
     * ============================
     */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /*
     * ============================
     * VARIABLES
     * ============================
     */

    let pdf = null;

    let currentPage = 1;

    let totalPages = 0;


    const pdfContainer =
        document.getElementById("pdf-container");

    const readerContent =
        document.getElementById("readerContent");

    const pageNumber =
        document.getElementById("pageNumber");

    const pageCount =
        document.getElementById("pageCount");


    /*
     * ============================
     * LOAD SAVED PAGE
     * ============================
     */

    const savedPage =
        parseInt(
            localStorage.getItem(
                `readhub_page_${bookTitle}`
            )
        );


    if (savedPage && savedPage > 0) {

        currentPage = savedPage;

    }


    /*
     * ============================
     * LOAD PDF
     * ============================
     */

    async function loadPDF() {

        if (!pdfFile) {

            pdfContainer.innerHTML =
                "<div class='loading'>No PDF selected.</div>";

            return;
        }


        try {

            const pdfUrl =
                `/static/pdf/${pdfFile}`;


            pdf =
                await pdfjsLib.getDocument(pdfUrl).promise;


            totalPages =
                totalPages =
                pdf.numPages;

            pageCount.textContent =
                totalPages;

            // Save total pages for library percentage calculation
            localStorage.setItem(
                `readhub_total_${bookTitle}`,
                totalPages
            );

            pageCount.textContent =
                totalPages;


            if (currentPage > totalPages) {

                currentPage = 1;

            }


            pdfContainer.innerHTML = "";


            await renderPage(currentPage);


        } catch (error) {

            console.error(error);

            pdfContainer.innerHTML =
                "<div class='loading'>Could not load this book.</div>";

        }

    }


    /*
     * ============================
     * RENDER PAGE
     * ============================
     */

    async function renderPage(pageNum) {

        if (!pdf) return;


        const page =
            await pdf.getPage(pageNum);


        const viewport =
            page.getViewport({
                scale: 1.4
            });


        const canvas =
            document.createElement("canvas");


        const context =
            canvas.getContext("2d");


        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;


        pdfContainer.innerHTML = "";

        pdfContainer.appendChild(canvas);


        await page.render({

            canvasContext: context,

            viewport: viewport

        }).promise;


        currentPage =
            pageNum;


        pageNumber.textContent =
            currentPage;


        /*
         * SAVE CURRENT PAGE
         */

        localStorage.setItem(
            `readhub_page_${bookTitle}`,
            currentPage
        );


        console.log(
            `Saved ${bookTitle} at page ${currentPage}`
        );


        /*
         * Scroll back to top
         */

        readerContent.scrollTop = 0;

    }


    /*
     * ============================
     * PREVIOUS PAGE
     * ============================
     */

    document
        .getElementById("prevPage")
        .addEventListener("click", async () => {

            if (currentPage <= 1) return;

            await renderPage(
                currentPage - 1
            );

        });


    /*
     * ============================
     * NEXT PAGE
     * ============================
     */

    document
        .getElementById("nextPage")
        .addEventListener("click", async () => {

            if (currentPage >= totalPages) return;

            await renderPage(
                currentPage + 1
            );

        });


    /*
     * ============================
     * FULLSCREEN
     * ============================
     */

    document
        .getElementById("fullscreenBtn")
        .addEventListener("click", () => {

            const reader =
                document.querySelector(
                    ".reader-container"
                );


            if (!document.fullscreenElement) {

                reader.requestFullscreen();

            } else {

                document.exitFullscreen();

            }

        });


    /*
     * ============================
     * KEYBOARD CONTROLS
     * ============================
     */

    document.addEventListener(
        "keydown",
        async (event) => {

            if (event.key === "ArrowRight") {

                if (currentPage < totalPages) {

                    await renderPage(
                        currentPage + 1
                    );

                }

            }


            if (event.key === "ArrowLeft") {

                if (currentPage > 1) {

                    await renderPage(
                        currentPage - 1
                    );

                }

            }

        }
    );


    /*
     * ============================
     * START
     * ============================
     */

    loadPDF();

</script>

</body>
</html>
