<title>ReadHub - Reader</title>

    <link rel="stylesheet" href="../static/css/style.css">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1f2923;
    }

    .reader-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ============================
    READER NAVIGATION
    ============================ */

    .reader-nav {
        height: 58px;
        flex-shrink: 0;
        padding: 0 24px;

        background: #2c3e35;
        color: white;

        display: flex;
        align-items: center;
        justify-content: space-between;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

        z-index: 10;
    }

    .reader-nav a {
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: opacity 0.2s ease;
    }

    .reader-nav a:hover {
        opacity: 0.8;
    }

    .reader-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;
        max-width: 55%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ============================
       PDF AREA
    ============================ */

    .reader-content {
        flex: 1;
        overflow: auto;

        display: flex;
        justify-content: center;
        align-items: flex-start;

        padding: 25px;

        background: #dfe3df;
    }

    #pdf-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;

        width: 100%;
    }

    .pdf-page {
        display: block;
        max-width: 100%;
        height: auto;

        background: white;

        box-shadow:
            0 4px 20px rgba(0, 0, 0, 0.18);
    }

    /* ============================
       LOADING / ERROR
    ============================ */

    .loading {
        color: #2c3e35;
        font-size: 18px;
        margin-top: 50px;
        text-align: center;
    }

    .error-message {
        color: #8b2e2e;
        background: white;
        padding: 20px 25px;
        border-radius: 10px;
        margin-top: 50px;
        text-align: center;
        max-width: 500px;
    }

    /* ============================
       READER CONTROLS
    ============================ */

    .reader-controls {
        position: fixed;

        bottom: 20px;
        left: 50%;

        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: 12px;

        padding: 10px 16px;

        background: #2c3e35;
        border-radius: 999px;

        color: white;

        box-shadow:
            0 5px 25px rgba(0, 0, 0, 0.25);

        z-index: 100;
    }

    .reader-controls button {
        border: none;

        background: #627563;
        color: white;

        min-width: 38px;
        height: 34px;

        padding: 6px 12px;

        border-radius: 7px;

        cursor: pointer;

        font-size: 14px;

        transition:
            background 0.2s ease,
            opacity 0.2s ease;
    }

    .reader-controls button:hover {
        background: #718574;
    }

    .reader-controls button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    #pageInfo {
        min-width: 90px;
        text-align: center;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        .reader-nav {
            padding: 0 14px;
        }

        .reader-content {
            padding: 12px;
        }

        .reader-controls {
            bottom: 12px;
            gap: 6px;
            padding: 8px 10px;
        }

        .reader-controls button {
            min-width: 34px;
            padding: 5px 8px;
        }
    }
</style>

```
<div class="reader-container">

    <!-- READER NAVIGATION -->
    <nav class="reader-nav">
        <a href="index.html">← ReadHub</a>
        <div class="reader-title" id="readerTitle">
            Reader
        </div>
    </nav>

    <!-- PDF AREA -->
    <main class="reader-content">

        <div id="pdf-container">
            <div class="loading">
                Loading book...
            </div>
        </div>

    </main>

</div>

<!-- READER CONTROLS -->
<div class="reader-controls">

    <button id="prevPage" disabled>
        ←
    </button>

    <span id="pageInfo">
        Page 1 / 1
    </span>

    <button id="nextPage" disabled>
        →
    </button>

    <button id="fullscreenBtn">
        ⛶
    </button>

</div>


<script>
    /*
     * ============================
     * PDF READER
     * ============================
     */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    const params = new URLSearchParams(window.location.search);

    const pdfFile = params.get("file");
    const bookTitle =
        params.get("title") || "Reader";


    const pdfContainer =
        document.getElementById("pdf-container");

    const readerTitle =
        document.getElementById("readerTitle");

    const prevPageButton =
        document.getElementById("prevPage");

    const nextPageButton =
        document.getElementById("nextPage");

    const pageInfo =
        document.getElementById("pageInfo");

    const fullscreenButton =
        document.getElementById("fullscreenBtn");


    readerTitle.textContent = bookTitle;


    /*
     * ============================
     * LOCAL STORAGE
     * ============================
     */

    const pageStorageKey =
        `readhub_page_${bookTitle}`;

    const totalStorageKey =
        `readhub_total_${bookTitle}`;

    const progressStorageKey =
        `readhub_progress_${bookTitle}`;


    let pdfDocument = null;
    let currentPage = 1;
    let totalPages = 1;


    /*
     * ============================
     * LOAD SAVED PAGE
     * ============================
     */

    const savedPage =
        parseInt(
            localStorage.getItem(pageStorageKey),
            10
        );

    if (!isNaN(savedPage) && savedPage > 0) {
        currentPage = savedPage;
    }


    /*
     * ============================
     * UPDATE CONTROLS
     * ============================
     */

    function updateControls() {

        pageInfo.textContent =
            `Page ${currentPage} / ${totalPages}`;

        prevPageButton.disabled =
            currentPage <= 1;

        nextPageButton.disabled =
            currentPage >= totalPages;
    }


    /*
     * ============================
     * SAVE PROGRESS
     * ============================
     */

    function saveProgress() {

        localStorage.setItem(
            pageStorageKey,
            currentPage
        );

        localStorage.setItem(
            totalStorageKey,
            totalPages
        );

        localStorage.setItem(
            progressStorageKey,
            JSON.stringify({
                page: currentPage,
                totalPages: totalPages
            })
        );
    }


    /*
     * ============================
     * RENDER PAGE
     * ============================
     */

    async function renderPage(pageNumber) {

        if (!pdfDocument) {
            return;
        }

        try {

            const page =
                await pdfDocument.getPage(pageNumber);


            const viewport =
                page.getViewport({
                    scale: 1.5
                });


            pdfContainer.innerHTML = "";


            const canvas =
                document.createElement("canvas");

            canvas.className = "pdf-page";

            const context =
                canvas.getContext("2d");


            canvas.width =
                viewport.width;

            canvas.height =
                viewport.height;


            pdfContainer.appendChild(canvas);


            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;


            currentPage = pageNumber;

            updateControls();

            saveProgress();


        } catch (error) {

            console.error(
                "Error rendering PDF page:",
                error
            );

            pdfContainer.innerHTML = `
                <div class="error-message">
                    Unable to display this page.
                </div>
            `;
        }
    }


    /*
     * ============================
     * LOAD PDF
     * ============================
     */

    async function loadPDF() {

        if (!pdfFile) {

            pdfContainer.innerHTML = `
                <div class="error-message">
                    No book was selected.
                </div>
            `;

            return;
        }


        const pdfURL =
            `../static/pdf/${encodeURIComponent(pdfFile)}`;


        try {

            pdfDocument =
                await pdfjsLib.getDocument(pdfURL).promise;


            totalPages =
                pdfDocument.numPages;


            localStorage.setItem(
                totalStorageKey,
                totalPages
            );


            if (currentPage > totalPages) {
                currentPage = 1;
            }


            updateControls();

            await renderPage(currentPage);


        } catch (error) {

            console.error(
                "Error loading PDF:",
                error
            );

            pdfContainer.innerHTML = `
                <div class="error-message">
                    <strong>Unable to open this book.</strong>
                    <br><br>
                    Please check that the PDF file exists in
                    <code>static/pdf/</code>.
                </div>
            `;
        }
    }


    /*
     * ============================
     * NEXT PAGE
     * ============================
     */

    nextPageButton.addEventListener(
        "click",
        function () {

            if (
                currentPage < totalPages
            ) {
                renderPage(
                    currentPage + 1
                );
            }
        }
    );


    /*
     * ============================
     * PREVIOUS PAGE
     * ============================
     */

    prevPageButton.addEventListener(
        "click",
        function () {

            if (currentPage > 1) {
                renderPage(
                    currentPage - 1
                );
            }
        }
    );


    /*
     * ============================
     * FULLSCREEN
     * ============================
     */

    fullscreenButton.addEventListener(
        "click",
        async function () {

            const reader =
                document.querySelector(
                    ".reader-container"
                );

            try {

                if (!document.fullscreenElement) {

                    await reader.requestFullscreen();

                } else {

                    await document.exitFullscreen();

                }

            } catch (error) {

                console.error(
                    "Fullscreen error:",
                    error
                );
            }
        }
    );


    /*
     * ============================
     * KEYBOARD CONTROLS
     * ============================
     */

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "ArrowRight") {

                if (
                    currentPage < totalPages
                ) {
                    renderPage(
                        currentPage + 1
                    );
                }

            }

            if (event.key === "ArrowLeft") {

                if (currentPage > 1) {
                    renderPage(
                        currentPage - 1
                    );
                }
            }
        }
    );


    /*
     * ============================
     * START READER
     * ============================
     */

    loadPDF();

</script>
